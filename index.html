<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - SGDEA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1565C0, #42A5F5);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .contenedor {
            text-align: center;
            animation: aparecer 1.5s ease-out;
        }

        /* Caja animada */
        .caja {
            width: 120px;
            height: 90px;
            background: #FFC107;
            border-radius: 8px;
            margin: 0 auto 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: flotar 2s ease-in-out infinite;
        }

        .caja::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 10px;
            width: 100px;
            height: 20px;
            background: #FFD54F;
            border-radius: 4px 4px 0 0;
        }

        .caja::after {
            content: '📦';
            font-size: 40px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 50px;
        }

        .autor {
            font-size: 1.1rem;
            background: rgba(255,255,255,0.15);
            padding: 20px 30px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .contador {
            margin-top: 40px;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .barra {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin: 15px auto 0;
            overflow: hidden;
        }

        .progreso {
            height: 100%;
            width: 100%;
            background: #FFC107;
            animation: cargar 15s linear forwards;
        }

        @keyframes cargar {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
    <!-- ⏳ Redirección automática después de 15 segundos -->
    <meta http-equiv="refresh" content="15; url=login.html">
</head>
<body>
    <div class="contenedor">
        <div class="caja"></div>
        
        <h1>¡Bienvenido al Sistema SGDEA!</h1>
        <p class="subtitulo">Sistema de Gestión Documental de Archivo</p>
        
        <div class="autor">
            👨‍💻 Creado por: <strong>Cristian Alberto Camacho Culma</strong>
        </div>

        <div class="contador">
            Redirigiendo en unos segundos...
            <div class="barra">
                <div class="progreso"></div>
            </div>
        </div>
    </div>
</body>
</html>
